<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer glow circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bgGradient)" opacity="0.5"/>
  
  <!-- Main container -->
  <rect x="20" y="20" width="80" height="80" rx="20" fill="#1e293b" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  
  <!-- Inner gradient overlay -->
  <rect x="20" y="20" width="80" height="80" rx="20" fill="url(#bgGradient)" opacity="0.3"/>
  
  <!-- Webhook icon (Material Symbols style) -->
  <g transform="translate(60, 60)" filter="url(#glow)">
    <!-- Main webhook paths -->
    <path d="M-12,-8 L-8,-12 L0,-4 L8,-12 L12,-8 L4,0 L12,8 L8,12 L0,4 L-8,12 L-12,8 L-4,0 Z" 
          fill="url(#iconGradient)" 
          stroke="#10b981" 
          stroke-width="1.5"
          stroke-linejoin="round"/>
    
    <!-- Center dot -->
    <circle cx="0" cy="0" r="3" fill="#10b981"/>
    
    <!-- Connection nodes -->
    <circle cx="-10" cy="0" r="2" fill="#10b981"/>
    <circle cx="10" cy="0" r="2" fill="#10b981"/>
    <circle cx="0" cy="-10" r="2" fill="#10b981"/>
    <circle cx="0" cy="10" r="2" fill="#10b981"/>
  </g>
  
  <!-- Rotating ring effect -->
  <circle cx="60" cy="60" r="45" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="8 8" opacity="0.3">
    <animateTransform
      attributeName="transform"
      attributeType="XML"
      type="rotate"
      from="0 60 60"
      to="360 60 60"
      dur="8s"
      repeatCount="indefinite"/>
  </circle>
</svg>
